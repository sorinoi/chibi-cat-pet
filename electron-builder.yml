# Windows x64 NSIS installer (NFR-08, NFR-09). Build with: npm run dist
appId: com.sorinoi.desktoppet
productName: Desktop Pet
copyright: Personal use, not distributed
directories:
  buildResources: build
  output: dist
# Vite bundles the renderer (vue) into out/. The only runtime dependency left in node_modules
# is koffi (FR-16), which main loads natively; ship just its Windows x64 binary.
files:
  - out/**
  - resources/**
  - package.json
  - '!node_modules/koffi/{doc,src,vendor,lib}/**'
  - '!node_modules/koffi/build/koffi/!(win32_x64)/**'
  - '!node_modules/koffi/build/koffi/win32_x64/*.{exp,lib}'
asar: true
# Native modules cannot load from inside app.asar.
asarUnpack:
  - node_modules/koffi/build/koffi/win32_x64/koffi.node
npmRebuild: false
# Ship only the Chromium locales we need; saves about 40 MB.
electronLanguages:
  - en-US
  - th
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  # Uninstall removes %APPDATA%\Desktop Pet (settings.json and Chromium caches).
  deleteAppDataOnUninstall: true
  include: build/installer.nsh
  shortcutName: Desktop Pet
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: desktop-pet-setup-${version}.${ext}
